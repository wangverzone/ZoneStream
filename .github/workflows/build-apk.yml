name: Build ZoneStream Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL Publik Backend ZoneStream (contoh: https://zonestream.anda.com) agar APK bisa streaming & login'
        required: false
        default: ''
      remote_server_url:
        description: 'Opsional: URL Live Web jika ingin APK memuat tampilan langsung dari server'
        required: false
        default: ''
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ZoneStream.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Capacitor Android
        run: |
          npm ci || npm install
          npm install --no-save @capacitor/android

      - name: Build ZoneStream web assets for APK
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.ZONESTREAM_API_URL || '' }}
        run: npm run build

      - name: Generate Android project & inject ZoneStream icon
        env:
          ZONESTREAM_SERVER_URL: ${{ github.event.inputs.remote_server_url || vars.ZONESTREAM_SERVER_URL || '' }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/prepare-android-apk.mjs
          npx cap sync android

      - name: Compile ZoneStream.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/ZoneStream.apk

      - name: Upload ZoneStream.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneStream-APK
          path: release-apk/ZoneStream.apk
          retention-days: 30

      - name: Publish Direct Download ZoneStream.apk Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: ZoneStream Android APK (Terbaru)
          body: |
            File APK asli **ZoneStream** siap instal & siap dibagikan langsung ke WhatsApp / Telegram / sosial media.
          files: release-apk/ZoneStream.apk
          make_latest: true


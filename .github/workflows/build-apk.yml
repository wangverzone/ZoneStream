name: Build ZoneStream Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL Publik Backend ZoneStream (otomatis terisi ke Vercel Anda)'
        required: false
        default: 'https://zonestream-beta.vercel.app'
      remote_server_url:
        description: 'Opsional: URL Live Web (biarkan kosong agar APK memakai aset offline lokal)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ZoneStream.apk
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK (Native Runner SDK + Auto-Fallback)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Installing Android command-line tools..."
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif [ -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          if [ -d "$SDK_DIR/platform-tools" ]; then
            echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          fi
          echo "Android SDK ready at: $SDK_DIR"

      - name: Install dependencies & Capacitor Android
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          if [ ! -d "node_modules/@capacitor/android" ]; then
            npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/android@8.6.2
          fi

      - name: Build ZoneStream web assets for APK
        run: |
          RAW_API="${{ github.event.inputs.api_base_url || vars.ZONESTREAM_API_URL || 'https://zonestream-beta.vercel.app' }}"
          CLEAN_API="${RAW_API%/}"
          echo "VITE_API_BASE_URL=${CLEAN_API}" >> "$GITHUB_ENV"
          VITE_API_BASE_URL="${CLEAN_API}" npm run build

      - name: Generate Android project & inject ZoneStream icon
        env:
          ZONESTREAM_SERVER_URL: ${{ github.event.inputs.remote_server_url || vars.ZONESTREAM_SERVER_URL || '' }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/prepare-android-apk.mjs
          npx cap sync android

      - name: Compile ZoneStream.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/ZoneStream.apk

      - name: Upload ZoneStream.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneStream-APK
          path: release-apk/ZoneStream.apk
          retention-days: 30

      - name: Publish Direct Download ZoneStream.apk Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: ZoneStream Android APK (Terbaru)
          body: |
            File APK asli **ZoneStream** siap instal & siap dibagikan langsung ke WhatsApp / Telegram / sosial media.
          files: release-apk/ZoneStream.apk
          make_latest: true

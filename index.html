    <meta name="apple-mobile-web-app-title" content="ZoneStream" />
    <title>ZoneStream — Streaming Anime &amp; Donghua Sub Indo</title>
    <meta
      name="description"
      content="Nonton Anime &amp; Donghua subtitle Indonesia terbaru secara real-time dengan tampilan gelap premium di ZoneStream."

    <meta property="og:title" content="ZoneStream — Streaming Anime &amp; Donghua Sub Indo" />

    />

      rel="stylesheet"
    />

    <!-- Theme pre-hydration: Mencegah kedipan saat berpindah mode Terang / Gelap -->
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('zonestream_theme_v1') ||
            localStorage.getItem('donghive_theme_v1');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F7FB] text-slate-900 dark:bg-[#090A0E] dark:text-[#F4F5F7] antialiased selection:bg-[#E84A18] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
